<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Таблиця з BEM</title>
    <style>
        /* Блок */
        .table {
            width: 60%;
            border-collapse: collapse;
            margin: 20px auto;
            font-family: Arial, sans-serif;
        }

        /* Елементи */
        .table__header {
            background-color: #f0f0f0;
        }

        .table__row {
            border-bottom: 1px solid #ccc;
        }

        .table__cell {
            padding: 10px;
            text-align: center;
            border: 1px solid #ccc;
        }

        /* Hover-ефект */
        .table__row:hover {
            background-color: #e6f2ff;
        }
    </style>
</head>
<body>

<table class="table">
    <thead class="table__header">
        <tr class="table__row">
            <th class="table__cell">Імʼя</th>
            <th class="table__cell">Група</th>
            <th class="table__cell">Оцінка</th>
        </tr>
    </thead>

    <tbody>
        <tr class="table__row">
            <td class="table__cell">Анастасія</td>
            <td class="table__cell">3С</td>
            <td class="table__cell">95</td>
        </tr>
        <tr class="table__row">
            <td class="table__cell">Олег</td>
            <td class="table__cell">3С</td>
            <td class="table__cell">88</td>
        </tr>
        <tr class="table__row">
            <td class="table__cell">Марія</td>
            <td class="table__cell">3С</td>
            <td class="table__cell">91</td>
        </tr>
    </tbody>
</table>

</body>
</html>
